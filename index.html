<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProLift | Gym Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 500px;
            margin: auto;
            padding: 20px;
            line-height: 1.5;
        }

        h1, h2 { font-weight: 800; letter-spacing: -0.5px; }
        h1 { font-size: 2rem; color: var(--accent); margin-bottom: 5px; }
        .subtitle { color: var(--text-dim); margin-bottom: 25px; font-size: 0.9rem; }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Inputs & Buttons */
        select, input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }

        button:active { transform: scale(0.98); }
        button.secondary { background: #334155; color: white; margin-top: 10px; }
        button.outline { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* Workout Active State */
        #activeWorkoutArea { border-left: 4px solid var(--accent); }
        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: #334155;
            color: var(--accent);
            margin-left: 8px;
        }

        /* History List */
        .history-item { margin-bottom: 15px; cursor: pointer; }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        .exercise-row {
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }
        .exercise-row:last-child { border: none; }
        
        .hidden { display: none; }

        .weight-hint {
            font-size: 0.8rem;
            color: var(--success);
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>ProLift</h1>
        <p class="subtitle">Track your gains, crush your goals.</p>
    </header>

    <div id="setupArea" class="card">
        <label style="font-size: 0.8rem; color: var(--text-dim);">Select Split</label>
        <select id="workoutType">
            <option value="Push">Push (Chest, Shoulders, Triceps)</option>
            <option value="Pull">Pull (Back, Biceps)</option>
            <option value="Legs">Legs (Quads, Hammies, Calves)</option>
            <option value="Core">Core & Cardio</option>
        </select>
        <button onclick="startWorkout()">Start New Session</button>
    </div>

    <div id="activeWorkoutArea" class="card hidden">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="currentWorkoutTitle" style="margin:0">Active Session</h3>
            <span id="timer" style="color: var(--accent); font-family: monospace;">00:00</span>
        </div>

        <select id="exerciseSelect" onchange="handleExerciseChange()"></select>
        <span id="prevWeightHint" class="weight-hint"></span>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px;">
            <input id="sets" type="number" placeholder="Sets" inputmode="numeric">
            <input id="reps" type="number" placeholder="Reps" inputmode="numeric">
            <input id="weight" type="number" placeholder="Kg" step="0.5" inputmode="decimal">
        </div>

        <button onclick="addExercise()">Add to Log</button>
        <button class="secondary" onclick="finishWorkout()">Finish Workout</button>
    </div>

    <h2>Activity History</h2>
    <div id="history"></div>

    <script>
        const exerciseMap = {
            Push: ["Bench Press", "Incline DB Press", "Overhead Press", "Lateral Raise", "Tricep Pushdown", "Dips"],
            Pull: ["Pull Ups", "Lat Pulldown", "Barbell Row", "Face Pulls", "Hammer Curls", "Preacher Curls"],
            Legs: ["Squats", "Leg Press", "RDL", "Leg Extensions", "Leg Curls", "Calf Raises"],
            Core: ["Plank", "Leg Raises", "Russian Twists", "Cable Crunches"]
        };

        const supabaseClient = window.supabase.createClient(
            "https://qgapzcakepiohslhszur.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYXB6Y2FrZXBpb2hzbGhzenVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTc2NTAsImV4cCI6MjA5Mjg3MzY1MH0.HoB0G9Li-D34qQSvBgbZL5yqn6MXVIpXHhTVIQWUGK0"
        );

        let currentWorkoutId = null;

        // Initialization
        window.onload = loadHistory;

        async function startWorkout() {
            const type = document.getElementById("workoutType").value;
            const { data, error } = await supabaseClient.from("workouts").insert({ type }).select();
            
            if (error) return alert("Error starting workout");

            currentWorkoutId = data[0].id;
            
            // UI Toggle
            document.getElementById("setupArea").classList.add("hidden");
            document.getElementById("activeWorkoutArea").classList.remove("hidden");
            document.getElementById("currentWorkoutTitle").innerText = `🔥 ${type} Day`;
            
            populateExercises(type);
        }

        function populateExercises(type) {
            const select = document.getElementById("exerciseSelect");
            select.innerHTML = '<option value="">Choose Exercise...</option>' + 
                exerciseMap[type].map(ex => `<option value="${ex}">${ex}</option>`).join("");
        }

        async function handleExerciseChange() {
            const name = document.getElementById("exerciseSelect").value;
            const hintEl = document.getElementById("prevWeightHint");
            
            if (!name) { hintEl.innerText = ""; return; }

            const { data } = await supabaseClient
                .from("exercises")
                .select("weight, reps")
                .eq("name", name)
                .order("created_at", { ascending: false })
                .limit(1);

            if (data && data[0]) {
                hintEl.innerText = `Last time: ${data[0].weight}kg for ${data[0].reps} reps`;
                document.getElementById("weight").value = data[0].weight;
            } else {
                hintEl.innerText = "First time doing this exercise!";
            }
        }

        async function addExercise() {
            const name = document.getElementById("exerciseSelect").value;
            const sets = parseInt(document.getElementById("sets").value);
            const reps = parseInt(document.getElementById("reps").value);
            const weight = parseFloat(document.getElementById("weight").value);

            if (!name || !sets || !reps || !weight) return alert("Fill all fields");

            const { error } = await supabaseClient.from("exercises").insert({
                workout_id: currentWorkoutId,
                name, reps, weight, sets
            });

            if (error) alert("Save failed");
            
            // Visual feedback - Clear inputs for next exercise
            document.getElementById("sets").value = "";
            document.getElementById("reps").value = "";
            document.getElementById("exerciseSelect").value = "";
            document.getElementById("prevWeightHint").innerText = "";
            
            loadHistory(); // Refresh history below
        }

        function finishWorkout() {
            currentWorkoutId = null;
            document.getElementById("setupArea").classList.remove("hidden");
            document.getElementById("activeWorkoutArea").classList.add("hidden");
        }

        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from("workouts")
                .select("*, exercises(*)")
                .order("date", { ascending: false });

            if (error) return;

            const container = document.getElementById("history");
            container.innerHTML = data.map(w => `
                <div class="card history-item">
                    <div class="history-header" onclick="toggleDetails('${w.id}')">
                        <div>
                            <span style="font-weight:bold">${getIcon(w.type)} ${w.type}</span>
                            <div style="font-size:0.7rem; color:var(--text-dim)">${new Date(w.date).toLocaleDateString()}</div>
                        </div>
                        <div style="text-align:right">
                            <span class="badge">${w.exercises.length} Exercises</span>
                        </div>
                    </div>
                    
                    <div id="details-${w.id}" class="hidden" style="margin-top:15px; border-top: 1px solid #334155; padding-top:10px;">
                        ${w.exercises.map(e => `
                            <div class="exercise-row">
                                <div style="font-weight:600; font-size:0.9rem">${e.name}</div>
                                <div style="font-size:0.8rem; color:var(--accent)">
                                    ${e.sets} sets × ${e.reps} reps @ ${e.weight}kg
                                </div>
                            </div>
                        `).join("")}
                        <button class="outline" style="margin-top:15px; padding:8px; font-size:0.8rem;" 
                                onclick="deleteWorkout('${w.id}')">Delete Entry</button>
                    </div>
                </div>
            `).join("");
        }

        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            el.classList.toggle("hidden");
        }

        async function deleteWorkout(id) {
            if (!confirm("Remove this workout from history?")) return;
            await supabaseClient.from("exercises").delete().eq("workout_id", id);
            await supabaseClient.from("workouts").delete().eq("id", id);
            loadHistory();
        }

        function getIcon(type) {
            const icons = { Push: "⚡", Pull: "🎣", Legs: "🦵", Core: "🧘" };
            return icons[type] || "🏋️";
        }
    </script>
</body>
</html>
