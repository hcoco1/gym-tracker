<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProLift | Gym Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --success: #22c55e;
    --danger: #ef4444;
}

* { box-sizing: border-box; transition: all 0.2s ease; }

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

h1 { color: var(--accent); }

.card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #334155;
}

select, input {
    background: #0f172a;
    border: 1px solid #334155;
    color: white;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
    margin-bottom: 12px;
}

button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 14px;
    border-radius: 8px;
    width: 100%;
    font-weight: 700;
    cursor: pointer;
}

button.secondary { background: #334155; color: white; }
button.outline { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
button.delete-workout {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-top: 12px;
    padding: 10px;
}

.hidden { display:none; }

#logoutBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 40px;
  height: 40px;
  background: #334155;
  color: #f1f5f9;
  border-radius: 10px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>ProLift</h1>
<div id="logoutBtn" onclick="logout()">⎋</div>

<!-- AUTH -->
<div id="authArea" class="card">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>
<button class="secondary" onclick="signIn()">Sign In</button>
</div>

<!-- SETUP -->
<div id="setupArea" class="card hidden">
<select id="workoutType">
<option value="Push">Push</option>
<option value="Pull">Pull</option>
<option value="Legs">Legs</option>
<option value="Core">Core</option>
</select>
<button onclick="startWorkout()">Start Workout</button>
</div>

<!-- ACTIVE -->
<div id="activeWorkoutArea" class="card hidden">

<select id="exerciseSelect" onchange="handleExerciseChange()"></select>
<span id="prevWeightHint" style="color:var(--success);font-size:12px;"></span>

<input id="sets" type="number" placeholder="Sets">
<input id="reps" type="number" placeholder="Reps">
<input id="weight" type="number" placeholder="Weight (kg)">

<button onclick="addExercise()">Add Exercise</button>
<button class="secondary" onclick="finishWorkout()">Finish Workout</button>

</div>

<h2>History</h2>
<div id="history"></div>

<script>

// ================= SUPABASE FIRST =================
const supabaseClient = window.supabase.createClient(
    "https://qgapzcakepiohslhszur.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnYXB6Y2FrZXBpb2hzbGhzenVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTc2NTAsImV4cCI6MjA5Mjg3MzY1MH0.HoB0G9Li-D34qQSvBgbZL5yqn6MXVIpXHhTVIQWUGK0"
);

// ================= STATE =================
let currentUser = null;
let currentWorkoutId = null;

// ================= AUTH =================
window.onload = async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (session) {
        currentUser = session.user;
        onLogin();
    } else {
        onLogout();
    }
};

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
        currentUser = session.user;
        onLogin();
    } else {
        currentUser = null;
        onLogout();
    }
});

function onLogin() {
    document.getElementById("authArea").classList.add("hidden");
    document.getElementById("setupArea").classList.remove("hidden");
    document.getElementById("logoutBtn").style.display = "flex";
    loadHistory();
}

function onLogout() {
    document.getElementById("authArea").classList.remove("hidden");
    document.getElementById("setupArea").classList.add("hidden");
    document.getElementById("logoutBtn").style.display = "none";
}

// ================= AUTH ACTIONS =================
async function signUp() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) return alert(error.message);

    alert("Check your email");
}

async function signIn() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) return alert(error.message);

    currentUser = data.user;
}

async function logout() {
    await supabaseClient.auth.signOut();
}

// ================= EXERCISES =================
const exerciseMap = {
Push: ["Bench Press","Incline Bench","Dips","Overhead Press","Lateral Raise","Tricep Pushdown"],
Pull: ["Pull Ups","Lat Pulldown","Barbell Row","Face Pull","Hammer Curl","Preacher Curl"],
Legs: ["Squat","Leg Press","Deadlift","Lunges","Leg Curl","Calf Raises"],
Core: ["Plank","Crunches","Leg Raises","Russian Twist","Ab Wheel"]
};

// ================= WORKOUT =================
async function startWorkout() {
    const type = document.getElementById("workoutType").value;

    const { data } = await supabaseClient
        .from("workouts")
        .insert({ type, user_id: currentUser.id })
        .select();

    currentWorkoutId = data[0].id;

    document.getElementById("setupArea").classList.add("hidden");
    document.getElementById("activeWorkoutArea").classList.remove("hidden");

    populateExercises(type);
}

function populateExercises(type) {
    const select = document.getElementById("exerciseSelect");
    select.innerHTML = `<option value="">Select Exercise</option>` +
        exerciseMap[type].map(e => `<option value="${e}">${e}</option>`).join("");
}

// ================= AUTOFILL =================
async function handleExerciseChange() {
    const name = document.getElementById("exerciseSelect").value;

    if (!name) return;

    const { data } = await supabaseClient
        .from("exercises")
        .select("weight,reps")
        .eq("name", name)
        .order("id", { ascending:false })
        .limit(1);

    if (data.length) {
        document.getElementById("prevWeightHint").innerText =
            `Last: ${data[0].weight}kg x ${data[0].reps}`;
        document.getElementById("weight").value = data[0].weight;
    }
}

// ================= ADD =================
async function addExercise() {
    const name = document.getElementById("exerciseSelect").value;
    const sets = document.getElementById("sets").value;
    const reps = document.getElementById("reps").value;
    const weight = document.getElementById("weight").value;

    if (!name || !sets || !reps || !weight) return alert("Fill all fields");

    await supabaseClient.from("exercises").insert({
        workout_id: currentWorkoutId,
        name, sets, reps, weight,
        user_id: currentUser.id
    });

    loadHistory();
}

// ================= HISTORY =================
async function loadHistory() {
    const { data } = await supabaseClient
        .from("workouts")
        .select("*, exercises(*)")
        .eq("user_id", currentUser.id)
        .order("date",{ascending:false});

    document.getElementById("history").innerHTML = (data || []).map(w=>`
        <div class="card">
            <b>${getIcon(w.type)} ${w.type} - ${new Date(w.date).toLocaleDateString()}</b>
            ${w.exercises.map(e=>`
                <div>${e.name} - ${e.sets}x${e.reps} @ ${e.weight}kg</div>
            `).join("")}
            <button class="delete-workout" onclick="deleteWorkout('${w.id}')">Delete</button>
        </div>
    `).join("");
}

async function deleteWorkout(workoutId) {
    if (!confirm("Delete this workout from history?")) return;

    const { error: exerciseError } = await supabaseClient
        .from("exercises")
        .delete()
        .eq("workout_id", workoutId)
        .eq("user_id", currentUser.id);

    if (exerciseError) return alert(exerciseError.message);

    const { error: workoutError } = await supabaseClient
        .from("workouts")
        .delete()
        .eq("id", workoutId)
        .eq("user_id", currentUser.id);

    if (workoutError) return alert(workoutError.message);

    if (currentWorkoutId === workoutId) currentWorkoutId = null;
    loadHistory();
}

// ================= UTIL =================
function getIcon(type){
    return {Push:"⚡",Pull:"🎣",Legs:"🦵",Core:"🧘"}[type] || "🏋️";
}

function finishWorkout(){
    document.getElementById("activeWorkoutArea").classList.add("hidden");
    document.getElementById("setupArea").classList.remove("hidden");
}
</script>

</body>
</html>
